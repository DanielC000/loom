name: Release

# Cut a release by pushing a tag: `git push origin vX.Y.Z` (see docs/releasing.md).
# The tag's version MUST match the root package.json `version` (the single source of truth) or the
# run fails fast. A prerelease tag (e.g. vX.Y.Z-beta.N) publishes to the matching npm dist-tag
# (beta) and marks the GitHub Release as a prerelease; a normal tag publishes to `latest`.
#
# Publishing uses npm TRUSTED PUBLISHING (OIDC) — NO long-lived NPM_TOKEN secret. The job mints a
# short-lived credential via GitHub's OIDC (`id-token: write`) and npm exchanges it; provenance is
# generated automatically. Requires npm CLI >= 11.5.1 (Node 22 ships npm 10.x, so we upgrade npm below)
# and Node >= 22.14.0. See https://docs.npmjs.com/trusted-publishers.
# Owner one-time prerequisites (see docs/releasing.md › "Owner publish steps"):
#   - the public GitHub repo exists,
#   - the npm `loomctl` name is reserved + a LICENSE chosen and added to the generated package.json,
#   - a TRUSTED PUBLISHER is configured on npmjs.com for the `loomctl` package: GitHub Actions →
#     organization/user `DanielC000`, repository `loom`, workflow filename `release.yml`, allowed
#     action `npm publish` (no environment). This replaces the old NPM_TOKEN secret.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual run releases the current package.json version (tag = v<version>)

permissions:
  contents: write # create the GitHub Release (and tag, on manual runs)
  id-token: write # npm publish --provenance (OIDC)
  actions: read # scripts/check-release-ci.mjs reads ci.yml's run conclusion for the released sha

jobs:
  # Card 1718416d — builds win-job-launcher.exe (the Windows Job Object containment launcher for
  # canonical git calls; docs/decisions/1718416d-win-job-launcher-containment.md) and load-smokes the
  # REAL binary (spawn, run a trivial job, confirm an abort settles confirmed; also smokes git's own
  # exit-code passthrough — scripts/smoke-win-job-launcher.mjs) before the main `release` job ever packs
  # it. Deliberately HARD-FAILS on any problem — unlike `build:native`'s own dev-time loud-no-op posture
  # (missing csc.exe there just means the daemon falls back), a RELEASE that silently ships without the
  # launcher is not an acceptable outcome; `release` below `needs` this job.
  build-windows-launcher:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # round 3, BLOCKING-1: both scripts below live at packages/daemon/scripts/, not repo-root
      # scripts/ (that directory holds a DIFFERENT, unrelated set — build-npm-package.mjs etc.) — a
      # bare `node scripts/...mjs` from this job's default (repo-root) cwd was MODULE_NOT_FOUND on every
      # real run; `working-directory` fixes the cwd for every `run:` step in this job (`uses:` steps,
      # e.g. the later actions/upload-artifact@v4, read `path:` repo-root-relative regardless, so that
      # one stays untouched).
      - name: Build win-job-launcher.exe (in-box .NET Framework csc.exe)
        shell: pwsh
        working-directory: packages/daemon
        run: |
          node scripts/build-native-launcher.mjs
          $exe = "assets/native/win-job-launcher.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "win-job-launcher.exe was not produced (build-native-launcher.mjs no-op'd — likely csc.exe missing on this runner). Failing the release rather than shipping silently without it."
            exit 1
          }
          Write-Host "Built: $exe"

      # round 2, MINOR c: moved out of inline PowerShell — a Start-Process-returned object needs its
      # own .Handle read once before .ExitCode/.HasExited can be trusted afterward (a known PowerShell
      # gotcha the old inline step didn't do), and its abort fired after a FIXED 300ms sleep rather than
      # an observable "has the hook actually started" signal. A plain Node ChildProcess avoids both: its
      # own "close" event carries the exit code directly, no separate handle-retention step needed. Also
      # now smokes git's own exit-code passthrough, which the old inline step never exercised at all.
      - name: Load-smoke the real binary (spawn, abort settles confirmed, git exit-code passthrough)
        shell: pwsh
        working-directory: packages/daemon
        run: node scripts/smoke-win-job-launcher.mjs

      - name: Upload win-job-launcher.exe
        uses: actions/upload-artifact@v4
        with:
          name: win-job-launcher-exe
          path: packages/daemon/assets/native/win-job-launcher.exe
          retention-days: 7

  release:
    needs: build-windows-launcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the sha-pinned daemon tests (pristine-prompt-refresh, comment-anchor-lint, ...) read older commits

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.4 # match the repo's packageManager (package.json)

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22" # resolves to the latest 22.x (>= 22.14.0, required for OIDC trusted publishing)
          registry-url: "https://registry.npmjs.org" # scope npm to the public registry (OIDC auth, no token)
          # No package-manager cache: never cache in a release build (publish only what was just built+tested).

      - name: Verify ci.yml is green for the released commit (card b854b35f)
        # Structural gate closing the paths that route around scripts/check-main-ci.mjs's `npm version`
        # preversion hook (workflow_dispatch, a manual `git tag -a` push, or forgetting to re-check by
        # hand — see docs/releasing.md). Deliberately placed here, BEFORE install/build/test, so a
        # bypassed or red commit fails in seconds instead of after ~10 minutes of wasted CI work; it
        # only needs git + node, both already available. Does NOT re-run e2e — it reads ci.yml's own
        # already-computed verdict for this exact sha (see the script's own header for the full
        # reasoning and the owner constraint it honors).
        run: node scripts/check-release-ci.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run daemon test suite (hermetic gate)
        run: pnpm --filter @loom/daemon test:daemon

      - name: Download win-job-launcher.exe (card 1718416d, built + load-smoked on windows-latest above)
        uses: actions/download-artifact@v4
        with:
          name: win-job-launcher-exe
          path: packages/daemon/assets/native

      - name: Verify win-job-launcher.exe landed where build-npm-package.mjs expects it
        run: test -f packages/daemon/assets/native/win-job-launcher.exe

      - name: Resolve release version & channel
        id: meta
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${PKG_VERSION}"
          fi
          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG (version $TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi
          if printf '%s' "$PKG_VERSION" | grep -q '-'; then
            PRERELEASE=true
            PRE="${PKG_VERSION#*-}"      # e.g. beta.1
            NPM_TAG="${PRE%%.*}"          # e.g. beta
          else
            PRERELEASE=false
            NPM_TAG=latest
          fi
          TARBALL="loomctl-${PKG_VERSION}.tgz"
          {
            echo "version=$PKG_VERSION"
            echo "tag=$TAG"
            echo "tarball=$TARBALL"
            echo "npm_tag=$NPM_TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG → npm dist-tag '$NPM_TAG' (prerelease=$PRERELEASE), artifact $TARBALL"

      - name: Pack the npm tarball
        run: node scripts/build-npm-package.mjs --no-build # reuse the built + tested dist

      - name: Verify tarball exists
        run: test -f "${{ steps.meta.outputs.tarball }}"

      - name: Upload the packed tarball (for global-install-smoke below)
        uses: actions/upload-artifact@v4
        with:
          name: loomctl-tarball
          path: ${{ steps.meta.outputs.tarball }}
          retention-days: 1

    outputs:
      tarball: ${{ steps.meta.outputs.tarball }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

  # Card 884c8d56 — a real `npm i -g` of the packed tarball, on BOTH platforms, before publish. Closes
  # the gap that let bundledDependencies silently break every Windows `npm i -g loomctl` (see
  # docs/decisions/884c8d56-no-bundleddependencies-in-published-package.md and docs/releasing.md):
  # there was previously no global-install smoke test anywhere in CI. Deliberately a SEPARATE job (not a
  # step inside `release`) so it runs on windows-latest too, not just release's own ubuntu-latest.
  #
  # Card d21719d3 — a SECOND matrix dimension, `npm: [stock, pinned]`, crossed with `os` for 4 legs
  # total. `stock` uses whatever npm each runner's Node 22 setup bundles (npm ~10.x); `pinned` upgrades
  # to the exact npm 11.x version the `publish` job below pins (`npm@11.18.0` — see that job's own step
  # for why that exact version) before running the same install. Node 24 ships npm 11 by default, and the
  # upstream bug this whole job guards against (npm/cli#7355, see docs/decisions/884c8d56-*.md) is still
  # open — covering npm 11 here proves the global-install path stays clean on the newer major too, not
  # only the one Node 22 happens to bundle. Each leg is an independent GitHub-hosted runner VM, so
  # upgrading npm on a `pinned` leg can never touch a `stock` leg's own npm.
  global-install-smoke:
    needs: release
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        npm: [stock, pinned]
    runs-on: ${{ matrix.os }}
    steps:
      # Needed for scripts/smoke-dist-shared-import.mjs below (the dynamic-import step) — this job has
      # no other checkout, since its first two real steps only need Node + the downloaded tarball.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Upgrade npm to the pinned 11.x (matches the publish job's own npm@11.18.0 pin below)
        if: matrix.npm == 'pinned'
        run: npm install -g npm@11.18.0

      - name: Report which npm ran this leg
        run: npm --version

      - name: Download the packed tarball
        uses: actions/download-artifact@v4
        with:
          name: loomctl-tarball

      - name: npm install --global (real registry-shaped install, scratch prefix)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loomctl-smoke-prefix" "$RUNNER_TEMP/loomctl-smoke-cache"
          npm install --global "${{ needs.release.outputs.tarball }}" \
            --prefix "$RUNNER_TEMP/loomctl-smoke-prefix" \
            --cache "$RUNNER_TEMP/loomctl-smoke-cache"

      - name: loom --version (via the real installed shim, never a flag that boots the daemon)
        shell: bash
        run: |
          set -euo pipefail
          # Code Review round 2, card 884c8d56: npm's `--prefix P` global-install layout differs by
          # platform — POSIX puts shims in P/bin and the package tree under P/lib/node_modules; Windows
          # puts shims directly in P and the package tree under P/node_modules. Put the right bin dir on
          # PATH per-platform and run the real installed shim via the bare `loom` name on BOTH legs — one
          # code path.
          #
          # On windows-latest, $RUNNER_TEMP reaches this MSYS Git Bash step in WINDOWS form (e.g.
          # `D:\a\_temp`), so joining it directly into PATH (`export PATH="$PREFIX:$PATH"`) puts a
          # backslash path into a COLON-separated PATH — it splits on the drive letter's own colon,
          # losing it (`D:\a\_temp\...` -> `D` + `\a\_temp\...`). npm's generated sh shim then computes
          # its own `$0`/basedir via `sed`+`cygpath -w`, and that drive-missing basedir gets re-mapped
          # onto the MSYS/Git install root (e.g. `C:\Program Files\Git\a\_temp\...`) instead of the real
          # path — a genuine MODULE_NOT_FOUND for a path that was never real. Reproduced directly in Git
          # Bash with a scratch prefix + a shim mirroring npm's real basedir computation (logs under
          # $LOOM_PROJECT_WORK_DIR/884c8d56/ at the time this was fixed). (An earlier version of this
          # comment misdiagnosed this as an "MSYS argv-mangling bug" specific to the bare `loom` shim vs.
          # `loom.cmd` — that was wrong: `loom.cmd` never computes a basedir from `$0` at all, so it only
          # happened to avoid the failure, and the Windows-form PATH entry it was still given "worked"
          # only by cwd-drive luck, not because the real cause was fixed.)
          #
          # Fix: `cygpath -u` the prefix into POSIX form BEFORE putting it on PATH, so the shim's own `$0`
          # is a genuine POSIX path and its `cygpath -w` round-trips back to the real Windows path.
          PREFIX="$RUNNER_TEMP/loomctl-smoke-prefix"
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$(cygpath -u "$PREFIX"):$PATH"
          else
            export PATH="$PREFIX/bin:$PATH"
          fi
          VERSION="$(loom --version)"
          echo "Installed + ran: $VERSION"
          test "$VERSION" = "${{ needs.release.outputs.version }}"

      - name: Dynamic-import a nested dist module that imports #loom-shared (never boots the daemon)
        shell: bash
        run: |
          set -euo pipefail
          # Code Review round, card 884c8d56: `loom --version` above only reads package.json — it
          # never loads dist/ or vendor/, so on its own it cannot catch a broken "#loom-shared" imports-
          # map resolution, a missed rewriteSharedSpecifiers() rewrite, a missing `vendor` entry in the
          # packed `files`, or a missing runtime dep. `npm root -g --prefix` resolves the platform-
          # correct package-tree root (never hand-built), and scripts/smoke-dist-shared-import.mjs
          # dynamic-imports a real nested dist module from it and fails loudly on any resolution error.
          NPM_ROOT="$(npm root -g --prefix "$RUNNER_TEMP/loomctl-smoke-prefix")"
          node scripts/smoke-dist-shared-import.mjs "$NPM_ROOT"

  publish:
    needs: [release, global-install-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing (needs npm >= 11.5.1; Node 22 ships npm 10.x)
        # PINNED to 11.18.0 (the version that shipped 0.16.0): npm@latest is now 12.0.0, whose provenance
        # path throws `Cannot find module 'sigstore'` (MODULE_NOT_FOUND) and breaks `npm publish` under
        # trusted-publishing/provenance — it blocked the first 0.17.0 release attempt. Re-pin to @latest once
        # a fixed 12.x ships. 11.18.0 is >= 11.5.1 (OIDC min) and known-good for automatic provenance.
        run: npm install -g npm@11.18.0 && npm --version

      - name: Download the packed tarball
        uses: actions/download-artifact@v4
        with:
          name: loomctl-tarball

      - name: Publish to npm (OIDC trusted publishing — no token; provenance is automatic)
        run: npm publish "${{ needs.release.outputs.tarball }}" --access public --tag "${{ needs.release.outputs.npm_tag }}"

      - name: Extract changelog notes
        run: node scripts/extract-changelog.mjs "${{ needs.release.outputs.version }}" > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: ${{ needs.release.outputs.tarball }}
          prerelease: ${{ needs.release.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
